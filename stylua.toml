# StyLua configuration for the Lua binding.
# Same settings as the game that vendors lua/vnoise.lua (ludum), so the copied
# binding stays byte-identical there.
syntax = "LuaJIT"
column_width = 120
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"

[sort_requires]
enabled = false
